<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sms</title>
    <script src="https://cdn.tailwindcss.com"></script>
     <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script> -->
    <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between gap-3">

      <!-- LOGO -->
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-white font-bold shadow-sm">
          P
        </div>
        <div class="hidden sm:block">
          <h1 class="text-lg font-bold tracking-tight text-slate-900">Practice API</h1>
          <p class="text-xs text-slate-500">Frontend for your MERN backend</p>
        </div>
      </div>

      <!-- STATUS PILLS -->
      <div class="flex items-center gap-2">
        <span id="userPill" class="inline-flex items-center rounded-full border border-slate-200 bg-white px-3 py-1 text-xs font-medium text-slate-600">
          Signed out
        </span>
        <span class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-1 text-xs font-medium text-slate-600">
          <span id="serverDot" class="h-2 w-2 rounded-full bg-slate-300"></span>
          <span id="serverText">Checking…</span>
        </span>
      </div>

    </div>

    <!-- TABS -->
    <nav id="tabs" class="flex gap-1 overflow-x-auto border-t border-slate-200 -mx-1 px-1">
      <button class="tab whitespace-nowrap rounded-t-lg px-4 py-2.5 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600" data-tab="students" type="button">Students</button>
      <button class="tab whitespace-nowrap rounded-t-lg px-4 py-2.5 text-sm font-semibold text-slate-500 border-b-2 border-transparent hover:text-slate-900" data-tab="analytics" type="button">Analytics</button>
      <button class="tab whitespace-nowrap rounded-t-lg px-4 py-2.5 text-sm font-semibold text-slate-500 border-b-2 border-transparent hover:text-slate-900" data-tab="create" type="button">Create</button>
      <button class="tab whitespace-nowrap rounded-t-lg px-4 py-2.5 text-sm font-semibold text-slate-500 border-b-2 border-transparent hover:text-slate-900" data-tab="auth" type="button">Auth &amp; Users</button>
      <button class="tab whitespace-nowrap rounded-t-lg px-4 py-2.5 text-sm font-semibold text-slate-500 border-b-2 border-transparent hover:text-slate-900" data-tab="tools" type="button">Tools</button>
    </nav>
  </div>
</header>
  </body>
</html>
